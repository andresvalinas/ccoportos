/* ---------- Pessoas ---------- */
function gerPessoas(G){
  if(!D.rhAbs.length && !D.rhDesl.length){
    return `<section><h2>Pessoas</h2><div class="nota">Aguardando a primeira coleta do robô de RH (coletor_rh.py).</div></section>`;
  }
  const temMes = D.rhAbsMes.length > 0;
  if(pessPer==="mes" && !temMes) pessPer = "ano";
  const baseAbs = pessPer==="mes" ? D.rhAbsMes : D.rhAbs;
  const baseTov = pessPer==="mes" ? D.rhDeslMes : D.rhDesl;
  const selPer = `<select class="mes" onchange="pessPer=this.value;render(abaAtual)" style="margin-left:12px">
    <option value="ano" ${pessPer==="ano"?"selected":""}>Acumulado do ano</option>
    <option value="mes" ${pessPer==="mes"?"selected":""} ${temMes?"":"disabled"}>Mês corrente${temMes?"":" (após próxima coleta)"}</option>
  </select>`;
  const opRH = local => {
    const sp = splitOpEPI(local||"—");
    if(/^YARA/i.test(sp.op) && (/CUBAT/i.test(sp.cid) || /GESSO/i.test(sp.op)))
      return {op:"YARA", cid:"CUBATÃO"};
    return sp;
  };
  const absG = baseAbs.map(r=>({...r, g: D.gerDe(r.local)})).filter(r=>r.g===G);
  const tovG = baseTov.map(r=>({...r, g: D.gerDe(r.local)})).filter(r=>r.g===G);
  const agg = {};
  const pegaAgg = local => {
    const sp = opRH(local), k = sp.op+" / "+sp.cid;
    if(!agg[k]) agg[k] = {op:sp.op, cid:sp.cid, n:0, prev:0, nao:0, leg:0, custo:0, desl:0, vol:0, inv:0, tov:null, tovN:0};
    return agg[k];
  };
  absG.forEach(r=>{ const a = pegaAgg(r.local);
    a.n++; a.prev += +r.h_previstas||0; a.nao += +r.nao_abonadas||0;
    a.leg += +r.leg_justificados||0; a.custo += +r.custo_abs||0; });
  tovG.forEach(r=>{ const a = pegaAgg(r.local);
    a.desl += +r.desligamentos||0; a.vol += +r.voluntarios||0; a.inv += +r.involuntarios||0;
    if(r.turnover_acum!=null){ a.tov = (a.tov||0) + +r.turnover_acum; a.tovN++; } });
  const ops2 = Object.values(agg).map(a=>({...a, pct: a.prev? Math.round(1000*(a.nao+a.leg)/a.prev)/10 : null,
    tovMed: a.tovN===1? a.tov : null}));
  const hPrev = absG.reduce((s,r)=>s+(+r.h_previstas||0),0);
  const hNao  = absG.reduce((s,r)=>s+(+r.nao_abonadas||0)+(+r.leg_justificados||0),0);
  const absPct = hPrev ? Math.round(1000*hNao/hPrev)/10 : null;
  const custoAbs = absG.reduce((s,r)=>s+(+r.custo_abs||0),0);
  const desl = tovG.reduce((s,r)=>s+(+r.desligamentos||0),0);
  const vol  = tovG.reduce((s,r)=>s+(+r.voluntarios||0),0);
  const inv  = tovG.reduce((s,r)=>s+(+r.involuntarios||0),0);

  let h = `<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
    <span style="font-size:13px;font-weight:700;color:var(--muted)">Período:</span>${selPer}</div>
  <div class="grid-big">
    ${big("Operações", absG.length, pessPer==="mes"?"com ponto no mês corrente":"com ponto no acumulado do ano", "")}
    ${big("Absenteísmo", absPct!=null? absPct.toLocaleString("pt-BR",{maximumFractionDigits:1})+"%":"—",
        hNao.toLocaleString("pt-BR",{maximumFractionDigits:0})+"h ausentes (faltas + atestados) de "+hPrev.toLocaleString("pt-BR",{maximumFractionDigits:0})+"h",
        absPct==null?"":absPct<=4.6?"ok":absPct<=8?"warn":"bad")}
    ${big("Custo do absenteísmo", fmtAuto(custoAbs), "no período (soma dos locais)", custoAbs>2e5?"bad":custoAbs>5e4?"warn":"")}
    ${big("Desligamentos", desl, vol+" voluntários · "+inv+" involuntários", desl>30?"bad":desl>12?"warn":"ok")}
  </div>`;

  // absenteísmo por operação (invertido: menor = melhor)
  const barsAbs = ops2.filter(a=>a.prev>0).sort((a,b)=>b.prev-a.prev).slice(0,8)
    .map(a=>({rot: a.op.slice(0,11), sub: Math.round(a.prev).toLocaleString("pt-BR")+"h prev.", v: a.pct}));
  const maxAbs = Math.max(10, ...barsAbs.map(b=>b.v))*1.25;
  h += `<section><h2>Absenteísmo por operação</h2>
    <div class="nota">% de absenteísmo dos maiores locais (verde ≤ 4,6%).</div>
    ${svgVBarPct(barsAbs, {inv:true, max:Math.ceil(maxAbs)})}
  </section>`;

  // turnover: rosca voluntário x involuntário + pareto de desligamentos por local
  const donTov = [{nome:"Involuntário", qtd: inv},{nome:"Voluntário", qtd: vol}].filter(x=>x.qtd>0);
  const parDesl = ops2.filter(a=>a.desl>0).sort((a,b)=>b.desl-a.desl).slice(0,8)
    .map(a=>({nome: a.op.slice(0,16), qtd: a.desl}));
  h += `<div class="duas">
    <section><h2>Desligamentos por tipo</h2><div class="nota">Acumulado do período.</div>${svgDonut(donTov, "deslig.")}</section>
    <section><h2>Desligamentos por operação</h2><div class="nota">Onde o time mais girou.</div>${svgPareto(parDesl)}</section>
  </div>`;

  // quadro por local: pessoas em uma linha por operação
  const opsPess = ops2.map(a=>a.op+" / "+a.cid).sort();
  h += `<section><h2>Pessoas por operação</h2>
    ${toolbar('tb-pess','🔎 Buscar operação…', opsPess, ops2.length+' operações · ordenado por % abs', 'pessoas_'+G.toLowerCase())}
    <div class="rolagem"><table id="tb-pess">
    <tr>${["Operação","H. previstas","Não abonadas","% Abs.","Custo abs.","Desligamentos","Turnover acum."].map((t,i)=>
      `<th class="${i>=1?"dir":""}" onclick="ordenaTabela('tb-pess',${i})" title="Clique para ordenar">${t}</th>`).join("")}</tr>` +
    ops2.sort((a,b)=>(b.pct||0)-(a.pct||0)).map(a=>{
      const busca = [a.op, a.cid].join(" ").toLowerCase();
      const pa = a.pct||0;
      return `<tr data-busca="${esc(busca)}" data-op="${esc(a.op+" / "+a.cid)}">
      <td><div class="cel-main">${esc(a.op)}${a.n>1? ` <span class="tag" style="background:#EDF1FA;color:#3552A6">${a.n} locais</span>`:""}</div><div class="cel-sub">${esc(a.cid)}</div></td>
      <td class="dir num">${Math.round(a.prev).toLocaleString("pt-BR")}h</td>
      <td class="dir num">${Math.round(a.nao).toLocaleString("pt-BR")}h</td>
      <td class="dir num"><span class="tag ${pa<=4.6?"verde":pa<=8?"ambar":"verm"}">${pa.toLocaleString("pt-BR")}%</span></td>
      <td class="dir num">${fmtAuto(a.custo)}</td>
      <td class="dir num">${a.desl||0}</td>
      <td class="dir num">${a.tovMed!=null? (Math.round(a.tovMed*10)/10).toLocaleString("pt-BR")+"%" : "—"}</td></tr>`}).join("") +
    `</table></div>
    <div class="nota" style="margin-top:10px">Dados agregados por local de trabalho (Portal RH). Lista nominal de colaboradores: próxima evolução do robô.</div>
  </section>`;
  return h;
}

/* ---------- Faturamento ---------- */
function gerFaturamento(G){
  if(!D.fat.length){
    return `<section><h2>Faturamento</h2><div class="nota">Aguardando a primeira coleta da fonte de Faturamento (roda nas coletas de 08:20/16:30, ou manualmente: <b>--so faturamento</b>).</div></section>`;
  }
  const fatG = D.fat.filter(f=>f.gerente===G);
  if(!fatG.length){
    return `<section><h2>Faturamento</h2><div class="nota">Nenhum contrato do faturamento casou com os contratos deste gerente (o vínculo usa o nº de contrato do cadastro RxO).</div></section>`;
  }
  const tot = fatG.reduce((s,f)=>s+(+f.total||0),0);
  const pend = fatG.reduce((s,f)=>s+(+f.pendente||0),0);
  const pPend = pct(pend, tot);
  let h = `<div class="grid-big" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr));max-width:420px">
    ${big("Em aberto", fmtAuto(pend), (pPend??"—")+"% do total ainda por faturar · "+fatG.filter(f=>+f.pendente>0).length+" projetos", pend>0? (pPend>8?"bad":"warn"):"ok")}
  </div>`;

  const pendentes = fatG.filter(f=>+f.pendente>0).sort((a,b)=>b.pendente-a.pendente);
  if(pendentes.length){
    h += `<section><h2>Pendências de faturamento</h2>
      <div class="nota">${pendentes.length} projetos com valor em aberto. NF: o export atual não traz o nº da fatura — entra quando plugarmos o Detalhamento Carteira.</div>
      <div class="rolagem"><table id="tb-pend">
      <tr>${["Operação","Contrato","NF","Valor em aberto"].map((t,i)=>
        `<th class="${i===3?"dir":""}" onclick="ordenaTabela('tb-pend',${i})" title="Clique para ordenar">${t}</th>`).join("")}</tr>` +
      pendentes.map(f=>`<tr data-busca="${esc([f.ref_cliente,f.cliente,f.contrato].join(" ").toLowerCase())}">
        <td><div class="cel-main">${esc(f.ref_cliente||"—")}</div><div class="cel-sub">${esc(f.cliente||"—")}</div></td>
        <td class="num">${esc(f.contrato||"—")}</td>
        <td class="num">—</td>
        <td class="dir num" data-v="${+f.pendente||0}"><span class="tag ${+f.pendente>2e5?"verm":"ambar"}">${fmtAuto(+f.pendente)}</span></td></tr>`).join("") +
      `</table></div></section>`;
  }

  h += `<section><h2>Faturamento por projeto</h2>
    ${toolbar('tb-fat','🔎 Buscar projeto, cliente, contrato…', null, fatG.length+' projetos · ordenado por pendente', 'faturamento_'+G.toLowerCase())}
    <div class="rolagem"><table id="tb-fat">
    <tr>${["Projeto","Contrato","Faturado","Pendente","Total"].map((t,i)=>
      `<th class="${i>=2?"dir":""}" onclick="ordenaTabela('tb-fat',${i})" title="Clique para ordenar">${t}</th>`).join("")}</tr>` +
    fatG.sort((a,b)=>(+b.pendente||0)-(+a.pendente||0)).map(f=>{
      const busca = [f.ref_cliente,f.cliente,f.contrato].join(" ").toLowerCase();
      return `<tr data-busca="${esc(busca)}">
      <td><div class="cel-main">${esc(f.ref_cliente||"—")}</div><div class="cel-sub">${esc(f.cliente||"—")}</div></td>
      <td class="num">${esc(f.contrato||"—")}</td>
      <td class="dir num" data-v="${+f.faturado||0}">${fmtAuto(+f.faturado||0)}</td>
      <td class="dir num" data-v="${+f.pendente||0}">${+f.pendente>0? `<span class="tag ${+f.pendente>2e5?"verm":"ambar"}">${fmtAuto(+f.pendente)}</span>` : `<span class="tag verde">R$ 0</span>`}</td>
      <td class="dir num destaque" data-v="${+f.total||0}">${fmtAuto(+f.total||0)}</td></tr>`}).join("") +
    `</table></div></section>`;
  return h;
}



/* ---------- Motor DRE navegável (+/-) ---------- */
function dreAbre(btn, id){
  const abrindo = btn.textContent === "+";
  btn.textContent = abrindo ? "\u2212" : "+";
  const filhos = [...document.querySelectorAll('tr[data-pai="'+id+'"]')];
  if(abrindo){ filhos.forEach(t=>t.style.display=""); return; }
  const fecha = pid => [...document.querySelectorAll('tr[data-pai="'+pid+'"]')].forEach(t=>{
    t.style.display = "none";
    const b = t.querySelector(".dre-mais"); if(b) b.textContent = "+";
    fecha(t.dataset.id);
  });
  fecha(id);
}

function dreArvoreHTML(nos, pfx){
  // nos: [{id, pai, nivel, nome, real, orc, temFilho}] em ordem de exibição
  const linha = n => {
    const d = (n.real!=null && n.orc!=null) ? n.real - n.orc : null;
    const neg = /dedu|cogs|imposto|custo|despes|sg&a/i.test(n.raiz||n.nome);
    const bom = d==null ? null : d>=0;
    return '<tr data-id="'+pfx+n.id+'"'+(n.pai!=null?' data-pai="'+pfx+n.pai+'" style="display:none"':'')+'>'+
      '<td style="padding-left:'+((n.nivel-1)*24+8)+'px;white-space:nowrap">'+
      (n.temFilho? '<button class="dre-mais" onclick="dreAbre(this,\''+pfx+n.id+'\')" '+
        'style="width:20px;height:20px;border:1px solid var(--border);border-radius:5px;background:var(--white);color:var(--royal);font-weight:800;cursor:pointer;margin-right:8px;line-height:1">+</button>'
        : '<span style="display:inline-block;width:28px"></span>')+
      '<span style="font-weight:'+(n.nivel===1?700:n.nivel===2?600:400)+'">'+esc(n.nome)+'</span></td>'+
      '<td class="dir num">'+fmtMil(n.real||0)+'</td>'+
      '<td class="dir num" style="color:var(--muted)">'+(n.orc!=null? fmtMil(n.orc):"—")+'</td>'+
      '<td class="dir num" style="font-weight:600;color:'+(bom==null?"var(--muted)":bom?"var(--verde)":"var(--verm)")+'">'+
        (d==null?"—":(d>=0?"\u25b2 ":"\u25bc ")+fmtMil(Math.abs(d)))+'</td></tr>';
  };
  return nos.map(linha).join("");
}

function dreNosOficial(mes){
  // árvore da fonte oficial #6 RxO (BU): caminhos hierárquicos completos
  const rows = D.resOf.filter(r=>r.anomes===mes);
  const vals = {}; let tot = {real:null, orc:null};
  for(const r of rows){
    let ch;
    if(r.dre==="Total"){
      if(r.caminho==="Total"){ tot[r.metrica==="Real"?"real":"orc"] = +r.valor; continue; }
      ch = r.caminho.slice(0, r.caminho.length-8); // remove " > Total"
    } else ch = r.caminho;
    if(!vals[ch]) vals[ch] = {real:null, orc:null};
    vals[ch][r.metrica==="Real"?"real":"orc"] = +r.valor;
  }
  const caminhos = Object.keys(vals).sort();
  const idx = {}; caminhos.forEach((c,i)=>idx[c]=i);
  const temFilho = {};
  caminhos.forEach(c=>{ const p = c.includes(" > ")? c.slice(0,c.lastIndexOf(" > ")) : null;
    if(p!=null && idx[p]!=null) temFilho[p]=true; });
  const nos = caminhos.map((c,i)=>{
    const partes = c.split(" > ");
    const p = partes.length>1? partes.slice(0,-1).join(" > ") : null;
    return {id:i, pai:(p!=null && idx[p]!=null)? idx[p] : null, nivel:partes.length,
            nome:partes[partes.length-1], raiz:partes[0],
            real:vals[c].real, orc:vals[c].orc, temFilho:!!temFilho[c]};
  });
  return {nos, tot};
}

function dreNosGerente(G, mes){
  // árvore do razão (por gerente): linha DRE -> subgrupos
  const rows = D.dre.filter(r=>r.gerente===G && r.anomes===mes);
  const porDre = {};
  rows.forEach(r=>{
    if(!porDre[r.dre]) porDre[r.dre] = {real:0, orc:0, subs:{}};
    porDre[r.dre].real += +r.realizado; porDre[r.dre].orc += +r.orcado;
    const s = r.sub || "Outros";
    if(!porDre[r.dre].subs[s]) porDre[r.dre].subs[s] = {real:0, orc:0};
    porDre[r.dre].subs[s].real += +r.realizado; porDre[r.dre].subs[s].orc += +r.orcado;
  });
  const nos = []; let tot = {real:0, orc:0};
  Object.keys(porDre).sort().forEach(dre=>{
    const n = porDre[dre];
    if(/^[1-5]\./.test(dre)){ tot.real += n.real; tot.orc += n.orc; }
    const subs = Object.entries(n.subs).filter(([s,v])=>Math.abs(v.real)>0.5||Math.abs(v.orc)>0.5);
    const id = nos.length;
    nos.push({id, pai:null, nivel:1, nome:dre, raiz:dre, real:n.real, orc:n.orc, temFilho:subs.length>1 || (subs.length===1 && subs[0][0]!=="Outros")});
    subs.sort((a,b)=>Math.abs(b[1].real)-Math.abs(a[1].real)).forEach(([s,v])=>{
      nos.push({id:nos.length, pai:id, nivel:2, nome:s, raiz:dre, real:v.real, orc:v.orc, temFilho:false});
    });
  });
  return {nos, tot};
}

function dreSecao(){
  try { return dreSecaoInterna(); }
  catch(e){ return '<section style="margin-top:16px"><h2>DRE — Real × Orçado</h2>'+
    '<div class="aviso">⚠ Erro ao montar o DRE navegável: '+esc(e.message)+' — me avise com um print deste texto.</div></section>'; }
}

function dreSecaoInterna(){
  // seção da Diretoria: filtro BU Portos / gerentes + mês
  const fontes = ["BU", ...GERENTES];
  const mesesDe = e => e==="BU" ? [...new Set(D.resOf.map(r=>r.anomes))].sort()
                                : [...new Set(D.dre.filter(r=>r.gerente===e).map(r=>r.anomes))].sort();
  if(!fontes.includes(dreEsc)) dreEsc = "BU";
  let meses = mesesDe(dreEsc);
  if(!meses.length) return "";
  if(!dreMes || !meses.includes(dreMes)) dreMes = meses[meses.length-1];
  const {nos, tot} = dreEsc==="BU" ? dreNosOficial(dreMes) : dreNosGerente(dreEsc, dreMes);
  if(!nos.length) return "";
  const dT = (tot.real!=null && tot.orc!=null)? tot.real-tot.orc : null;
  const selE = '<select class="mes" onchange="dreEsc=this.value;render(abaAtual)">'+
    fontes.map(f=>'<option value="'+f+'" '+(f===dreEsc?"selected":"")+'>'+(f==="BU"?"BU Portos (oficial)":cap(f))+'</option>').join("")+'</select>';
  const selM = '<select class="mes" onchange="dreMes=this.value;render(abaAtual)">'+
    meses.map(m=>'<option value="'+m+'" '+(m===dreMes?"selected":"")+'>'+nomeMes(m)+'</option>').join("")+'</select>';
  return '<section style="margin-top:16px"><h2 style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">DRE — Real × Orçado '+selE+selM+
    '<span style="font-size:11px;font-weight:600;color:var(--muted)">use o + para detalhar cada linha</span></h2>'+
    '<div class="rolagem"><table><tr><th>Linha</th><th class="dir">Real</th><th class="dir">Orçado</th><th class="dir">Δ R−O</th></tr>'+
    dreArvoreHTML(nos, "dd_")+
    '<tr class="total"><td style="padding-left:36px">Total'+(dreEsc==="BU"?"":" (1–5)")+'</td>'+
    '<td class="dir num">'+fmtMil(tot.real||0)+'</td><td class="dir num">'+fmtMil(tot.orc||0)+'</td>'+
    '<td class="dir num" style="color:'+(dT==null?"var(--muted)":dT>=0?"var(--verde)":"var(--verm)")+'">'+
      (dT==null?"—":(dT>=0?"\u25b2 ":"\u25bc ")+fmtMil(Math.abs(dT)))+'</td></tr>'+
    '</table></div></section>' + dreInsights(nos, tot.real, tot.orc);
}



/* ---------- Leitura do mês (insights automáticos do DRE) ---------- */
function dreInsights(nos, totR, totO){
  const F = v => fmtMil(Math.abs(v));
  const par = txt => '<p style="margin:0 0 12px;font-size:13.5px;line-height:1.75;color:var(--text)">'+txt+'</p>';
  const b = t => '<b>'+t+'</b>';
  const vd = t => '<b style="color:var(--verde)">'+t+'</b>';
  const vm = t => '<b style="color:var(--verm)">'+t+'</b>';
  let ps = [];

  // 1) o veredito
  let dTot = null;
  if(totR!=null && totO!=null && Math.abs(totO)>0.5){
    dTot = totR - totO;
    const pT = pct(totR, totO);
    const tom = dTot>=0 ? "fechou "+vd("acima da meta") :
      (pT!=null && pT>=90 ? "fechou um pouco "+vm("abaixo da meta") : "fechou "+vm("bem abaixo da meta"));
    ps.push(par("O recorte "+tom+": resultado de "+b(fmtMil(totR))+" contra "+b(fmtMil(totO))+" orçados — "+
      (dTot>=0? vd("+"+F(dTot)) : vm("−"+F(dTot)))+(pT!=null? " ("+pT+"% do combinado)":"")+"."));
  }

  // 2) a receita
  const rec = nos.find(n=>n.nivel===1 && /^1\./.test(n.nome));
  if(rec && rec.real!=null && rec.orc!=null){
    const d = rec.real - rec.orc, p = pct(rec.real, rec.orc);
    ps.push(par(d>=0
      ? "A receita "+vd("não foi o problema")+": "+b(fmtMil(rec.real))+" faturados, "+p+"% do orçado — "+vd(F(d)+" a mais")+" que o combinado."
      : "A receita "+vm("ficou devendo")+": "+b(fmtMil(rec.real))+", só "+p+"% do orçado ("+vm("−"+F(d))+")."));
  }

  // 3) os vilões — com o culpado dentro do culpado
  const base = Math.max(10000, Math.abs(totO||totR||0)*0.005);
  const subs = nos.filter(n=>n.nivel===2 && n.real!=null && n.orc!=null && Math.abs(n.orc)>0.5)
    .map(n=>({...n, d:n.real-n.orc, paiNome:(n.pai!=null? (nos[n.pai]?.nome||"").replace(/^\d+\.\s*(\( - \)\s*)?/,"") : "")}));
  const viloes = subs.filter(s=>s.d < -base).sort((a,b)=>a.d-b.d).slice(0,3);
  viloes.forEach((s,i)=>{
    const pEst = s.orc? Math.round(100*Math.abs(s.d)/Math.abs(s.orc)) : null;
    let drill = "";
    const filhos = nos.filter(n=>n.pai===s.id && n.real!=null);
    if(filhos.length){
      const comOrc = filhos.filter(f=>f.orc!=null && Math.abs(f.orc)>0.5).map(f=>({...f, d:f.real-f.orc}));
      const pior = comOrc.filter(f=>f.d<0).sort((a,b)=>a.d-b.d)[0];
      if(pior && Math.abs(pior.d) > base*0.5){
        drill = " — puxado principalmente por "+b(esc(pior.nome))+" ("+vm(F(pior.d)+" além do previsto")+")";
      } else {
        const maior = filhos.sort((a,b)=>Math.abs(b.real)-Math.abs(a.real))[0];
        if(maior) drill = " — com "+b(esc(maior.nome))+" respondendo pela maior fatia ("+F(maior.real)+")";
      }
    }
    const abre = i===0 ? "Do lado dos gastos, o maior vilão foi " : (i===1 ? "Na sequência, " : "E ainda ");
    ps.push(par(abre+b(esc(s.nome))+" <span style='color:var(--muted)'>("+esc(s.paiNome)+")</span>, que estourou "+
      vm(F(s.d))+(pEst!=null? " ("+pEst+"% acima do orçado)":"")+drill+"."));
  });

  // 4) o lado bom
  const eco = subs.filter(s=>s.d > base).sort((a,b)=>b.d-a.d)[0];
  if(eco){
    const compensa = dTot!=null && dTot<0 ? " — segurou parte do tombo, mas não o suficiente" : "";
    ps.push(par("Do lado bom, "+b(esc(eco.nome))+" <span style='color:var(--muted)'>("+esc(eco.paiNome)+")</span> veio "+
      vd(F(eco.d)+" melhor que o orçado")+compensa+"."));
  }

  // 5) as ressalvas
  const semOrc = nos.filter(n=>n.nivel===1 && n.real!=null && (n.orc==null || Math.abs(n.orc)<0.5) && Math.abs(n.real)>base);
  if(semOrc.length){
    const soma = semOrc.reduce((s,n)=>s+n.real,0);
    ps.push(par("Uma ressalva de leitura: "+b(esc(semOrc.map(n=>n.nome.replace(/^\d+\.\s*(\( - \)\s*)?/,"")).join(" e ")))+
      " ("+F(soma)+" no real, somados) "+b("não têm orçado mapeado")+" — o desvio dessas linhas fica fora da comparação, e o retrato completo depende delas."));
  }

  if(!ps.length) return "";
  return '<section style="margin-top:14px"><h2>Leitura do mês</h2>'+
    '<div style="background:#F7F9FE;border-left:4px solid var(--royal);border-radius:0 10px 10px 0;padding:16px 18px 6px;margin-top:10px">'+
    ps.join("")+
    '<p style="margin:0 0 10px;font-size:11px;color:var(--muted)">Análise gerada automaticamente do recorte selecionado — muda junto com o mês e a operação.</p>'+
    '</div></section>';
}

/* ---------- Custos de Manutenção (aba do gerente) ---------- */
let gcMes = null;

function gerCustos(G){
  try { return gerCustosInterna(G); }
  catch(e){ return '<section><h2>Custos de Manutenção</h2><div class="aviso">⚠ Erro: '+esc(e.message)+' — me avise com um print.</div></section>'; }
}

function gerCustosInterna(G){
  const meses = [...new Set(D.custos.filter(r=>r.gerente===G).map(r=>r.anomes))].sort();
  if(!meses.length) return '<section><h2>Custos de Manutenção</h2><div class="nota">Sem custos coletados para este gerente ainda.</div></section>';
  if(!gcMes || !meses.includes(gcMes)) gcMes = meses[meses.length-1];
  const agoraYM = String(new Date().getFullYear()*100 + (new Date().getMonth()+1));
  const selM = '<select class="mes" onchange="gcMes=this.value;render(abaAtual)">'+
    meses.map(m=>'<option value="'+m+'" '+(m===gcMes?"selected":"")+'>'+nomeMes(m)+(m===agoraYM?" (parcial)":"")+'</option>').join("")+'</select>';

  const custoMes = +((D.custos.find(r=>r.gerente===G && r.anomes===gcMes)||{}).custo||0);
  const orcMes = +((D.orcManut.find(r=>r.gerente===G && r.anomes===gcMes)||{}).orcado_manut||0);
  const pM = pct(custoMes, orcMes);
  const anoSel = gcMes.slice(0,4);
  const acumR = D.custos.filter(r=>r.gerente===G && r.anomes.slice(0,4)===anoSel && r.anomes<=gcMes)
    .reduce((s,r)=>s+ +r.custo,0);
  const acumO = D.orcManut.filter(r=>r.gerente===G && r.anomes.slice(0,4)===anoSel && r.anomes<=gcMes)
    .reduce((s,r)=>s+ +r.orcado_manut,0);
  const pA = pct(acumR, acumO);
  const maqMes = D.custoMaq.filter(r=>r.gerente===G && r.anomes===gcMes)
    .map(r=>({...r, custo:+r.custo})).sort((a,b)=>b.custo-a.custo);
  const opMes = D.custoOp.filter(r=>r.gerente===G && r.anomes===gcMes)
    .map(r=>({...r, custo_real:+r.custo_real||0, custo_orc:+r.custo_orc||0}))
    .filter(r=>Math.abs(r.custo_real)>0.5 || Math.abs(r.custo_orc)>0.5)
    .sort((a,b)=>b.custo_real-a.custo_real);

  let h = '<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">'+
    '<span style="font-size:13px;font-weight:700;color:var(--muted)">Mês:</span>'+selM+'</div>';
  h += '<div class="grid-big" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">'+
    big("Custo "+nomeMes(gcMes)+(gcMes===agoraYM?" (parcial)":""), fmtMil(custoMes),
        orcMes? ((pM??"—")+"% do orçado ("+fmtMil(orcMes)+")") : "sem orçado mapeado",
        pM==null?"":pM<=85?"ok":pM<=100?"warn":"bad")+
    big("Acumulado "+anoSel, fmtAuto(acumR),
        acumO? ((pA??"—")+"% do orçado acumulado ("+fmtAuto(acumO)+")") : "jan até "+nomeMes(gcMes),
        pA==null?"":pA<=95?"ok":pA<=105?"warn":"bad")+
    big("Máquinas com custo", maqMes.length, "no mês · maior: "+(maqMes[0]? maqMes[0].maquina+" ("+fmtMil(maqMes[0].custo)+")":"—"), "")+
  '</div>';

  // custo por operação
  if(opMes.length){
    h += '<section><h2>Custo por operação — '+nomeMes(gcMes)+'</h2><div class="rolagem"><table id="tb-gcop">'+
      '<tr>'+["Operação","Real","Orçado","% do orçado"].map((t,i)=>'<th class="'+(i?"dir":"")+'" onclick="ordenaTabela(\'tb-gcop\','+i+')" title="Clique para ordenar">'+t+'</th>').join("")+'</tr>'+
      opMes.map(r=>{
        const p2 = pct(r.custo_real, r.custo_orc);
        return '<tr><td>'+esc(r.nome_cl||r.cl)+'</td>'+
          '<td class="dir num" data-v="'+r.custo_real+'">'+fmtMil(r.custo_real)+'</td>'+
          '<td class="dir num" data-v="'+r.custo_orc+'" style="color:var(--muted)">'+(r.custo_orc?fmtMil(r.custo_orc):"—")+'</td>'+
          '<td class="dir num" data-v="'+(p2??-1)+'" style="font-weight:700;color:'+(p2==null?"var(--muted)":p2<=85?"var(--verde)":p2<=100?"var(--yellow)":"var(--verm)")+'">'+(p2!=null?p2+"%":"—")+'</td></tr>';
      }).join("")+'</table></div></section>';
  }

  // custo por máquina
  if(maqMes.length){
    const lojas = [];
    h += '<section><h2>Custo por máquina — '+nomeMes(gcMes)+'</h2>'+
      toolbar('tb-gcmaq','🔎 Buscar máquina…', lojas, maqMes.length+' máquinas · ordenado por custo', 'custos_'+G.toLowerCase())+
      '<div class="rolagem"><table id="tb-gcmaq">'+
      '<tr>'+["Máquina","Custo no mês","Lançamentos"].map((t,i)=>'<th class="'+(i?"dir":"")+'" onclick="ordenaTabela(\'tb-gcmaq\','+i+')" title="Clique para ordenar">'+t+'</th>').join("")+'</tr>'+
      maqMes.map(r=>'<tr data-busca="'+esc(String(r.maquina).toLowerCase())+'">'+
        '<td class="num"><div class="cel-main">'+esc(r.maquina)+'</div>'+
        (D.equipIdx[r.maquina]? '<div class="cel-sub">'+esc(D.equipIdx[r.maquina].nome_cl||"")+'</div>':'')+'</td>'+
        '<td class="dir num" data-v="'+r.custo+'">'+fmtMil(r.custo)+'</td>'+
        '<td class="dir num" data-v="'+(+r.lancamentos||0)+'">'+(r.lancamentos||"—")+'</td></tr>').join("")+
      '</table></div></section>';
  }
  // evolução mensal (real × orçado)
  h += '<section><h2>Evolução no ano — Real × Orçado</h2><div class="rolagem"><table>'+
    '<tr><th>Mês</th><th class="dir">Real</th><th class="dir">Orçado</th><th class="dir">% do orçado</th></tr>'+
    meses.filter(m=>m.slice(0,4)===anoSel).map(m=>{
      const r = +((D.custos.find(x=>x.gerente===G && x.anomes===m)||{}).custo||0);
      const o = +((D.orcManut.find(x=>x.gerente===G && x.anomes===m)||{}).orcado_manut||0);
      const p2 = pct(r,o);
      return '<tr'+(m===gcMes?' style="background:#F0F4FF"':'')+'><td>'+nomeMes(m)+(m===agoraYM?' <span class="cel-sub">(parcial)</span>':'')+'</td>'+
        '<td class="dir num">'+fmtMil(r)+'</td><td class="dir num" style="color:var(--muted)">'+(o?fmtMil(o):"—")+'</td>'+
        '<td class="dir num" style="font-weight:700;color:'+(p2==null?"var(--muted)":p2<=85?"var(--verde)":p2<=100?"var(--yellow)":"var(--verm)")+'">'+(p2!=null?p2+"%":"—")+'</td></tr>';
    }).join("")+'</table></div></section>';

  return h;
}

/* ---------- Seminovos (enxoval das lojas) ---------- */
function gerSeminovos(G){
  if(!D.enx.length){
    return `<section><h2>Seminovos</h2><div class="nota">Aguardando a primeira coleta do robô do Enxoval (coletor_enxoval.py). Assim que rodar, esta aba mostra os ativos do gerente que estão nas lojas de seminovos.</div></section>`;
  }
  const rows = D.enx.filter(e=>e.gerente===G);
  if(!rows.length){
    return `<section><h2>Seminovos</h2><div class="nota">Nenhum ativo deste gerente consta no enxoval das lojas — frota 100% na operação. 🎉</div></section>`;
  }
  const neg = rows.filter(r=>/negocia/i.test(r.situacao||""));
  const disp = rows.filter(r=>/dispon/i.test(r.situacao||""));
  const man = rows.filter(r=>/manut/i.test(r.situacao||"") || /sim/i.test(r.em_manut||""));
  let h = `<div class="grid-big">
    ${big("Nas lojas", rows.length, "ativos do gerente no enxoval de seminovos", rows.length>15?"bad":rows.length>5?"warn":"")}
    ${big("Em negociação de venda", neg.length, "caminho da desmobilização", neg.length?"ok":"")}
    ${big("Disponíveis", disp.length, "parados em vitrine (custo até vender)", disp.length>8?"bad":disp.length>3?"warn":"ok")}
    ${big("Em manutenção", man.length, "preparação para venda", "")}
  </div>`;

  const lojas = [...new Set(rows.map(r=>r.loja||"—"))].sort();
  const tagSit = s => /negocia/i.test(s||"") ? "ambar" : /dispon/i.test(s||"") ? "verde" : /manut/i.test(s||"") ? "verm" : "";
  h += `<section><h2>Ativos nas lojas de seminovos</h2>
    <div class="nota">Cruzamento enxoval × cadastro RxO: estes ativos seguem no custo da operação até a venda. Fonte: Painel Enxoval (foto diária).</div>
    ${toolbar('tb-enx','🔎 Buscar ativo, tipo, loja…', lojas, rows.length+' ativos · ordenado por situação', 'seminovos_'+G.toLowerCase())}
    <div class="rolagem"><table id="tb-enx">
    <tr>${["Ativo","Loja","Horímetro","Situação","Status no plano","Gerente manutenção"].map((t,i)=>
      `<th class="${i===2?"dir":""}" onclick="ordenaTabela('tb-enx',${i})" title="Clique para ordenar">${t}</th>`).join("")}</tr>` +
    rows.sort((a,b)=>(a.situacao||"").localeCompare(b.situacao||"")).map(r=>{
      const busca = [r.ativo, r.tipo, r.marca, r.loja, r.situacao].join(" ").toLowerCase();
      return `<tr data-busca="${esc(busca)}" data-op="${esc(r.loja||"—")}">
      <td class="num"><div class="cel-main">${esc(r.ativo)}</div><div class="cel-sub">${esc([r.tipo,r.marca,r.ano].filter(Boolean).join(" · "))}</div></td>
      <td>${esc(r.loja||"—")}</td>
      <td class="dir num" data-v="${+r.horimetro||0}">${r.horimetro!=null? Math.round(+r.horimetro).toLocaleString("pt-BR")+" h":"—"}</td>
      <td><span class="tag ${tagSit(r.situacao)}">${esc(r.situacao||"—")}</span></td>
      <td>${esc(r.status_plano||"—")}</td>
      <td>${esc(r.gerente_manut||"—")}</td></tr>`}).join("") +
    `</table></div></section>`;
  return h;
}

/* ---------- Frota (mapa) ---------- */
function gerFrota(G){
  const fr = D.frota.filter(f=>f.gerente===G);
  const agora = Date.now();
  const validas = fr.map(f=>f.location_datetime||f.snapshot_date)
    .filter(d=>d && new Date(d).getTime() <= agora + 864e5).sort();
  const ultima = validas.pop();
  const ultimaTxt = ultima ? new Date(ultima).toLocaleDateString("pt-BR") : "—";
  const gpsSet = new Set(fr.map(f=>f.ativo));
  const cadastro = D.equipG ? D.equipG[G]||[] : [];
  const semGps = cadastro.filter(e=>!gpsSet.has(e.ativo));
  const pctGps = cadastro.length ? Math.round(100*fr.length/cadastro.length) : null;
  const lig = fr.filter(f=>f.engine_on===true).length;
  const des = fr.filter(f=>f.engine_on===false).length;
  const cats = {};
  fr.forEach(f=>{ const c=(f.categoria||"outros").toLowerCase(); cats[c]=(cats[c]||0)+1; });
  const rotCat = {maquina:"Máquinas", caminhao:"Caminhões", empilhadeira:"Empilhadeiras", plataforma:"Plataformas", veiculo:"Veículos", outros:"Outros"};
  const chips = Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([c,n])=>
    `<span style="display:inline-flex;align-items:center;gap:6px;background:var(--white);border:1px solid var(--border);border-radius:20px;padding:5px 14px;font-size:12px;font-weight:700;color:var(--title)">${n} <span style="font-weight:600;color:var(--muted)">${rotCat[c]||cap(c)}</span></span>`).join(" ");
  let h = `<div class="grid-big" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">
    ${big("Máquinas no mapa", fr.length, cadastro.length? `de ${cadastro.length} ativos no cadastro (${pctGps}%)` : "com última posição conhecida", fr.length? "ok":"bad")}
    ${big("Ligadas agora", lig, "motor ligado no último sinal", lig? "ok":"")}
    ${big("Desligadas", des, "motor desligado no último sinal", "")}
    ${big("Sem rastreamento", semGps.length, "ativos do cadastro sem posição conhecida", semGps.length>cadastro.length*0.4?"bad":semGps.length?"warn":"ok")}
  </div>
  ${chips? `<div style="display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 14px">${chips}</div>`:""}`;
  if(!fr.length){
    h += `<section><h2>Frota no mapa</h2><div class="nota">Nenhuma posição de telemetria mapeada para este gerente ainda. O coletor de telemetria (portal TOTAL) está aguardando reativação.</div></section>`;
    return h;
  }
  // quadro de todos os ativos do gerente, pesquisável e ordenável
  const frMap = Object.fromEntries(fr.map(f=>[f.ativo, f]));
  h += `<section><h2>Ativos do gerente (${cadastro.length})</h2>
    <div class="nota">Cadastro oficial da BU. Digite para filtrar; clique nos títulos para ordenar — a coluna Rastreamento denuncia quem está sem sinal.</div>
    ${(()=>{const opsFr = opsDe(cadastro.filter(e=>e.nome_cl), e=>{const sp=splitOpEPI(e.nome_cl); return sp.op+" / "+sp.cid;});
      return toolbar('tb-frota','🔎 Buscar ativo…', opsFr, cadastro.length+' ativos no cadastro', 'ativos_'+G.toLowerCase());})()}
    <div class="rolagem"><table id="tb-frota">
    <tr>${["Ativo","Horímetro","Marca/Modelo","Operação","Última posição","Fonte"].map((t,i)=>
      `<th class="${i===1?"dir":""}" onclick="ordenaTabela('tb-frota',${i})" title="Clique para ordenar">${t}</th>`).join("")}</tr>` +
    cadastro.map(e=>{
      const g = frMap[e.ativo];
      const dt = g && (g.location_datetime||g.snapshot_date);
      const dtTxt = dt ? new Date(dt).toLocaleDateString("pt-BR") : "—";
      const fonte = g ? (g.location_source||"?").toUpperCase() : "—";
      const spo = e.nome_cl ? splitOpEPI(e.nome_cl) : null;
      const busca = [e.ativo,e.descricao,e.marca,e.modelo,e.nome_cl,fonte].join(" ").toLowerCase();
      const hor = D.horIdx[e.ativo];
      const horTel = g && g.hourmeter ? +g.hourmeter : null;
      const horV = hor ? +hor.horimetro_acumulado : horTel;
      const horData = hor ? new Date(hor.data_leitura+"T12:00").toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"}) : (horTel? "tel." : "");
      return `<tr data-busca="${esc(busca)}" data-op="${spo?esc(spo.op+" / "+spo.cid):""}">
      <td class="num"><div class="cel-main">${esc(e.ativo)}</div><div class="cel-sub">${esc(e.descricao||"—")}</div></td>
      <td class="dir num">${horV!=null? `<div class="cel-main">${Math.round(horV).toLocaleString("pt-BR")} h</div><div class="cel-sub">${horData}</div>` : "—"}</td>
      <td>${esc([e.marca,e.modelo].filter(Boolean).join(" ")||"—")}</td>
      <td>${spo?esc(spo.op+" - "+spo.cid):"—"}</td>
      <td class="num">${g?dtTxt:'<span class="tag verm">sem sinal</span>'}</td>
      <td>${esc(fonte)}</td></tr>`}).join("") +
    `</table></div></section>`;

  const dias = d => Math.floor((Date.now()-new Date(d).getTime())/864e5);
  const desatualizado = ultima && dias(ultima) > 3;
  h += `<section><h2>Frota no mapa</h2>
    <div class="nota">${desatualizado? `⚠ Posições de ${ultimaTxt} — o coletor de telemetria está parado; as máquinas podem ter se movido desde então. `:""}Clique no ponto para detalhes. Verde = motor ligado · cinza = desligado · azul = sem info de motor · vermelho = sem sinal há 7+ dias.</div>
    <div id="mapa-frota" style="height:520px;border-radius:8px;border:1px solid var(--border)"></div>
  </section>`;
  return h;
}
let mapaLeaflet = null;
function initMapaFrota(G){
  const el = document.getElementById("mapa-frota");
  if(!el || typeof L === "undefined") return;
  const fr = D.frota.filter(f=>f.gerente===G && f.latitude && f.longitude);
  if(mapaLeaflet){ mapaLeaflet.remove(); mapaLeaflet = null; }
  const mapa = L.map("mapa-frota").setView([-15.5, -52], 4);
  mapaLeaflet = mapa;
  const cinza = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}",
    {attribution:"© Esri", maxZoom: 16});
  const satelite = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    {attribution:"© Esri", maxZoom: 18});
  const ruas = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
    {attribution:"© Esri", maxZoom: 18});
  ruas.addTo(mapa);
  L.control.layers({"Mapa": ruas, "Satélite": satelite, "Cinza": cinza}, null, {position:"topright"}).addTo(mapa);
  const dias = d => d? Math.floor((Date.now()-new Date(d).getTime())/864e5) : 999;
  const pts = [];
  fr.forEach(f=>{
    const dd = dias(f.location_datetime||f.snapshot_date);
    const cor = dd>7 ? "#d63131" : f.engine_on===true ? "#00A843" : f.engine_on===false ? "#7A8699" : "#0D33A8";
    const emoji = {maquina:"🚜", caminhao:"🚛", empilhadeira:"🏗️", plataforma:"🛗", veiculo:"🚗"}[(f.categoria||"").toLowerCase()] || "⚙️";
    const pino = L.divIcon({className:"", iconSize:[30,30], iconAnchor:[15,30], popupAnchor:[0,-28],
      html:`<div style="width:28px;height:28px;background:${cor};border:2px solid #fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 2px 6px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center"><span style="transform:rotate(45deg);font-size:13px;line-height:1">${emoji}</span></div>`});
    const m = L.marker([f.latitude, f.longitude], {icon: pino}).addTo(mapa);
    m.bindPopup(`<div style="font-family:'Open Sans';font-size:12px;line-height:1.5">
      <b style="font-family:Montserrat;color:#002A9A">${esc(f.ativo)}</b><br>
      ${esc(f.description||f.model||"")}<br>
      <b>Operação:</b> ${esc(f.nome_cl||"—")}<br>
      <b>Motor:</b> ${f.engine_on===true?'<span style="color:#00A843;font-weight:700">Ligado</span>':f.engine_on===false?'Desligado':'—'}${f.speed!=null && +f.speed>0? ` · ${Math.round(+f.speed)} km/h`:""}<br>
      <b>Horímetro:</b> ${f.hourmeter? (+f.hourmeter).toLocaleString("pt-BR")+" h":"—"}<br>
      <b>Posição:</b> ${f.location_datetime? new Date(f.location_datetime).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"}):"—"}
      · fonte ${esc((f.location_source||"?").toUpperCase())}</div>`);
    pts.push([f.latitude, f.longitude]);
  });
  if(pts.length) mapa.fitBounds(pts, {padding:[18,18], maxZoom: 12});
}

    ]},
  ];
  return grupos.map(g=>`<section><h2>${g.t}</h2>
    <div class="grid-big" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">` +
    g.itens.map(it=>`<a href="${it.u}" target="_blank" rel="noopener" style="text-decoration:none">
      <div class="big" style="height:100%;cursor:pointer">
        <div class="big-t" style="display:flex;justify-content:space-between;align-items:center">${esc(it.n)}<span style="color:var(--title)">↗</span></div>
        <div class="big-s" style="margin-top:6px">${esc(it.d)}</div>
      </div></a>`).join("") +
    `</div></section>`).join("");
}

function render(aba){
  abaAtual = aba;
  document.querySelectorAll("aside button").forEach(b=>b.classList.toggle("ativo", b.dataset.aba===aba));
  document.getElementById("migalha").innerHTML = aba==="Diretoria"
    ? `CCO PORTOS / <b>VISÃO GERAL</b>`
    : aba==="Links"
    ? `CCO PORTOS / <b>LINKS ESTRATÉGICOS</b>`
    : `CCO PORTOS / GERENTES / <b>${esc(nomeCompleto(aba).toUpperCase())}</b>${subAba!=="Resumo"?" / "+esc(subAba.toUpperCase()):""}`;
  document.getElementById("titulo-pagina").textContent = aba==="Diretoria" ? "Diretoria" : aba==="Links" ? "Links Estratégicos" : nomeCompleto(aba);
  const sub = document.getElementById("subabas");
  const c = document.getElementById("conteudo");
  if(aba==="Diretoria"){
    sub.style.display="none";
    try { c.innerHTML = avisoColetores() + abaDiretoria(); }
    catch(e){ c.innerHTML = '<div class="aviso">⚠ Erro ao montar a Diretoria: '+esc(e.message)+' ('+esc((e.stack||"").split("\n")[1]||"")+') — me mande um print.</div>'; }
  } else if(aba==="Links"){
    sub.style.display="none";
    c.innerHTML = abaLinks();
  } else {
    sub.style.display="flex";
    sub.innerHTML = SUBS.map(s=>`<button data-sub="${s}" class="${s===subAba?"ativo":""}">${s}</button>`).join("");
    const G = aba.toUpperCase();
    c.innerHTML = avisoColetores() + (subAba==="Resumo" ? gerResumo(G)
                : subAba==="DRE" ? gerDRE(G)
                : subAba==="Corretivas & Preventivas" ? gerOsPrev(G)
                : subAba==="Pessoas" ? gerPessoas(G)
                : subAba==="Faturamento" ? gerFaturamento(G)
                : subAba==="Frota" ? gerFrota(G)
                : subAba==="Seminovos" ? gerSeminovos(G)
                : subAba==="Custos Manutenção" ? gerCustos(G)
                : gerEPI(G));
    if(subAba==="Frota") setTimeout(()=>initMapaFrota(G), 50);
  }
  const ultimo = D.saude.filter(s=>s.sucesso).map(s=>s.executado_em).sort().pop();
  const elAtu = document.getElementById("menu-atualizacao");
  if(elAtu && ultimo){
    const dt = new Date(ultimo.replace(" ","T"));
    elAtu.textContent = "Última atualização: " +
      dt.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"}) + " às " +
      dt.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  }
  document.getElementById("rodape").textContent = "";
}
